name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm install -g npm@11.6.2
          npm ci

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /nikah-invite
          NEXT_PUBLIC_RSVP_API_URL: ${{ secrets.NEXT_PUBLIC_RSVP_API_URL }}
        run: |
          # Drop dev route types checked in with the repo. Next.js 16 type-checks
          # .next/dev/types even when distDir is dist, and those files still point
          # at /api and /admin after the directories below are moved aside.
          rm -rf .next dist
          # The static export must not read server secrets from a committed env file.
          rm -f .env.local
          mkdir -p .pages-exclude
          mv src/app/api .pages-exclude/api
          mv src/app/admin .pages-exclude/admin
          npx next build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
